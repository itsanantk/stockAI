# stockAI — self-running trading sessions + auto-updating dashboard.
#
# Sized for ~30% of a Claude Max 5x weekly budget:
#   - one PRE-MARKET full research session (Opus) before the 9:30 ET open,
#     which queues orders that fill at the opening auction
#   - hourly Sonnet CHECK-INS while the market is open (act only on
#     stops/targets/thesis-breaking news)
# Cron is UTC and GitHub's scheduler is BEST-EFFORT: firings routinely run
# 5-45 min late and are dropped outright (it dropped every morning firing on
# Jul 28 AND Jul 29). Individual crons cannot be made reliable, so we fire a
# BARRAGE and let agent.py resolve_mode() decide which firings do AI work:
#   - pre-market barrage every 10 min: the first surviving firing runs the
#     deep session, the rest see it's done and exit in seconds
#   - every 15 min while the market is open: a rate gate in the agent keeps
#     check-ins ~hourly (same AI usage as before), and "skipped" firings
#     still fill pending orders, snapshot equity, and redeploy the dashboard,
#     so the site refreshes every ~15 min all day
#   - if somehow EVERY pre-market firing is dropped, the first open-market
#     firing promotes itself to the full session
# Runner minutes are free (public repo). --skip-if-closed drops
# holiday/closed firings; times below are ET-summer (winter shifts 1h early,
# still inside valid windows — the agent gates on the TSX clock, not cron).
#
# Required repo secret (Settings -> Secrets -> Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  — from `claude setup-token` (uses your Claude
#                              subscription; no API credits needed)
# Optional: ANTHROPIC_API_KEY — if set (with credits), the API backend is used.

name: stockAI trading session

on:
  schedule:
    - cron: "50 11 * * 1-5"     # pre-market barrage: 7:50 ET, then
    - cron: "*/10 12-13 * * 1-5"  # every 10 min 8:00-9:50 ET — first
                                  # surviving firing runs the deep session
    - cron: "*/15 14-20 * * 1-5"  # market hours: every 15 min; the agent
                                  # keeps check-ins ~hourly, extra firings
                                  # just refresh fills/equity/dashboard
  workflow_dispatch: {}         # manual "Run workflow" button

concurrency:
  group: trading
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run trading session
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python agent.py run --skip-if-closed --mode auto

      - name: Daily summary
        env:
          PYTHONUNBUFFERED: "1"
        run: python agent.py daily

      - name: Commit portfolio state
        run: |
          git config user.name "stockai-bot"
          git config user.email "stockai-bot@users.noreply.github.com"
          git add data/stockai.db data/dashboard.html
          git commit -m "session $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push

      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          cp data/dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: trade
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
