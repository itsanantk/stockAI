2192 $79). I liquidated both legacy positions and rebuilt around the other side of that trade.\n\n**Sold DPM.TO** (\u2212$45, \u22125.6%). I had written the falsification test into my last note: *\"if gold doesn't catch a bid within a few sessions of a real de-escalation, reassess.\"* That test ran and failed. Gold fell to $4,029 and is \u221228% from its January record specifically on **hawkish Fed** expectations \u2014 the mechanism ran backwards, with hike odds *rising* to 46.5% even as oil crashed. Confirmed technically by a failed breakout: I'd filled the exact gap-up high on Jul 27 and it closed lower three sessions running.\n\n**Sold TOU.TO** (\u2212$16, \u22121.6%). Its catalyst was the Hormuz closure spiking international LNG \u2014 precisely what de-escalation dismantles. With North American gas also falling to $2.72 there was no offset, and I wasn't willing to hold 19% of the book through tonight's binary print with the thesis already gone.\n\n**Bought AC.TO, 33 sh @ $25.47 (17%).** Air Canada suspended its 2026 guidance in April *explicitly* over war-driven jet fuel \u2014 the exact cause now being removed. Fuel is ~25\u201330% of costs, so this is mechanical, not a story, and the chart confirms the linkage (it fell to $22.58 as crude hit $100, then +12.6% in two sessions). Target $29, stop $23.40.\n\n**Bought CLS.TO, 1 sh @ $484 (10%).** My prior note said \"watch the reaction, do not pre-position\" \u2014 I didn't, and the reaction was decisive: revenue +62%, EPS $2.54 vs $1.39, and FY guidance raised *past* consensus. At ~$343 USD vs a ~$427 USD average target and 26% below its 52-week high, the drift has room. Target $560, stop $425.\n\n**One process catch worth flagging:** a generic earnings calendar listed Air Canada as reporting tomorrow. Air Canada's own July 21 advisory confirms **August 12** \u2014 had I trusted the calendar I'd have either skipped a good setup or walked into the same binary print I just sold TOU to avoid.\n\n**Holding 73% cash ture as IMO at $100 Brent. Kept SMALLEST of the energy legs (14%) for two honest reasons: it is the most extended name in the group (+19.7% in a month, vs IMO +13%), and it is genuinely correlated with\n- SELL 7 SU.TO @ 89.920  [realized -5.06]\n  - Thesis-break: US paused Iran strikes 2nd straight night, talks turning positive, Brent -8.2% / WTI -7.6% today on de-escalation. Master thesis-break rule: sell pure upstream oil beta FIRST on credible de-escalation, regardless of price.\n- SELL 5 IMO.TO @ 176.490  [realized -2.95]\n  - Thesis-break: same de-escalation headline (US-Iran strike pause, oil crashing 8%). Refining-crack cushion doesn't offset a crude collapse of this size; exiting same day per plan, ahead of Jul 31 earnings which is now a bigger risk than opportunity.\n\n## Open positions\n- DPM.TO: 15 sh @ 52.93, last 51.05, P&L -28.20 (-3.55%)\n- TOU.TO: 15 sh @ 63.85, last 63.57, P&L -4.20 (-0.44%)\n\n## AI session recap\nChecked both positions \u2014 no action needed, thesis intact on both:\n\n- **DPM.TO** (-3.24% today, last $50.75): Gold is actually *up* slightly today ($4,083, +0.7%) on the same Iran de-escalation news that's driving the stock's own moves \u2014 so DPM's dip looks like broad equity/risk-off noise or profit-taking after last week's breakout, not a thesis break. No fresh negative news; Q1 was strong (revenue +115% YoY). Stop $46.50, target $60 \u2014 well clear of the stop, holding.\n- **TOU.TO** (-2.27% today, last $63.65): No negative catalyst \u2014 TD raised target to $66, Desjardins to $68, insider buying in early July, Scotiabank strong-buy. Reports earnings Jul 29 as planned. Stop $60, target $72 \u2014 holding through the print.\n- Iran/Hormuz situation: still a fragile, back-and-forth de-escalation (talks ongoing, no full resolution), consistent with last session's read \u2014 nothing new that changes positioning.\n\nNo trades this check-in; nothing hit a stop, target, or thesis-break trigger."}, {"date": "2026-07-25", "ts": "2026-07-25 14:53:34", "content": "# Daily summary \u2014 2026-07-25\n\nEquity $5,000.00  |  day P&L +0.00 (+0.00%)\nSince inception: +0.00% vs S&P 500 +0.00% (alpha +0.00%)  |  cash $5,000.00\n\n## Trades today\n- none\n\n## Open positions\n- none (all cash)\n\n## Pending market-on-open orders\n- BUY IMO.TO $980\n- BUY TOU.TO $980\n- BUY DPM.TO $800\n- BUY SU.TO $700\n"}, {"date": "2026-07-24", "ts": "2026-07-24 22:58:47", "content": "# Daily summary \u2014 2026-07-24\n\nEquity $5,000.00  |  day P&L +0.00 (+0.00%)\nSince inception: +0.00% vs S&P 500 +0.00% (alpha +0.00%)  |  cash $5,000.00\n\n## Trades today\n- none\n\n## Open positions\n- none (all cash)\n\n## Pending market-on-open orders\n- BUY IMO.TO $980\n- BUY TOU.TO $980\n- BUY DPM.TO $800\n- BUY SU.TO $700\n\n## AI session recap\n**Done \u2014 four orders queued for Monday's open, $3,460 deployed (69%), $1,540 cash.**\n\n**Thesis re-verified and it got stronger, not weaker.** Brent topped $100 on Jul 23, the Houthis opened a *second* chokepoint in the Red Sea while Hormuz is still shut, and the US is on day 13 of strikes. Friday's -3% oil day was profit-taking inside a week that was still +10%.\n\n**What I bought:**\n\n- **IMO $980 (20%)** \u2014 Refining cracks blow out at $100 Brent, so it captures the move without pure crude beta. Q2 print Jul 31 is a live catalyst into an exceptional quarter.\n- **TOU $980 (20%)** \u2014 The non-oil leg. Qatar is ~20% of global LNG and it *also* transits Hormuz, so international LNG pricing is spiking; TOU has direct LNG-linked contracts plus LNG Canada ramping to nameplate.\n- **DPM $800 (16%)** \u2014 A deliberate hedge, and the most useful thing I found. Gold is being *suppressed* by this war: the oil-inflation spike keeps the Fed hawkish and the USD bid. Gold's trigger is de-escalation \u2014 exactly what breaks my three energy legs. It also broke out Friday to a 3-month high on 3x volume with its own drivers (Vare\u0161 ramp, \u010coka Rakita).\n- **SU $700 (14%)** \u2014 Smallest on purpose. It's the redundant leg: correlated with IMO, most extended at +19.7%/mo, weaker tell.\n\n**The sizing came from one test.** On Friday's -3% oil day: TOU +0.41% > IMO -0.10% > SU -0.67% > CNQ -1.09%. That ranking set both position sizes and my exit order. **I dropped CNQ entirely** \u2014 pure upstream had the weakest tell, and adding a fourth crude name would have collapsed the book into a single bet.\n\n**Two things I'm watching.** The master thesis-break is unchanged: any credible de-escalation headline and I sell SU first, then IMO, same day \u2014 but I *hold* DPM into it, since it's the beneficiary. And IMO (Jul 31) and TOU (Aug 5) both report inside my window; I'm holding through, but they're defined binary risks, not free catalysts.\n\nOne judgment call worth flagging: I'm buying energy after a +10% week, near the highs. IMO's refusal to drop on a -3% oil day is what justified it \u2014 but if that relative strength breaks on the next down-oil day, the entry premise is gone regardless of where the stops sit.\n\nSources: [CNN](https://www.cnn.com/2026/07/23/world/live-news/iran-war-trump) \u00b7 [Invezz \u2014 oil](https://invezz.com/news/2026/07/24/oil-prices-fall-3-but-remain-on-track-for-biggest-weekly-gains-in-months/) \u00b7 [Invezz \u2014 gold](https://invezz.com/news/2026/07/24/gold-falls-despite-war-risks-has-100-oil-rewritten-the-safe-haven-trade/) \u00b7 [Imperial Oil IR](https://news.imperialoil.ca/news-releases/news-releases/2026/Imperial-to-hold-2026-Second-Quarter-Earnings-Call/default.aspx) \u00b7 [RBN Energy \u2014 Tourmaline](https://rbnenergy.com/daily-posts/analyst-insight/q1-2026-earnings-calls-tourmaline-says-western-canadas-gas-glut-looks)"}], "generated": "2026-07-28 14:22 ET", "market": {"now_toronto": "2026-07-28 14:22 EDT", "is_open": true, "session": "open", "detail": "regular session"}, "perf": {"starting_cash": 5000.0, "equity": 4924.02, "cash": 3599.94, "return_pct": -1.52, "benchmarks": {"ZSP.TO": {"ince e stock, and those now face normalizing international gas. Holding 19% of the book through a binary event where my catalyst has been removed and only the downside guidance risk remains is a gamble, not edge. My rule is to re-underwrite after the print; the honest re-underwrite done BEFORE the print says the reason I owned it is gone. Taking ~-1.6% (~-$15) \u2014 a cheap exit \u2014 to redeploy into catalysts already in hand rather than ones I have to pray for. TOU remains a quality gas producer with a real LNG Canada ramp; it is a fine business but no longer a swing-trade catalyst, and I will re-enter on a post-print setup if the guidance is strong and gas turns.", "session_id": "20260728-141457-df9e5d"}, {"id": 7, "ts": "2026-07-28 14:17:21", "ticker": "DPM.TO", "side": "sell", "shares": 15, "price": 49.98, "commission": 1.0, "notional": 749.7, "realized_pnl": -45.25, "reason": "THESIS FALSIFIED \u2014 executing my own pre-committed test. I bought DPM explicitly as the DE-ESCALATION HEDGE, on the logic that gold was being SUPPRESSED by the war (oil-inflation spike -> hawkish Fed -> bid USD) and would therefore re-rate when the war ENDED. I wrote the falsification test into my last note: \"if gold doesn't catch a bid within a few sessions of a real de-escalation, reassess.\" That test has now run and FAILED. De-escalation is real and deepening \u2014 WTI has collapsed from $100 (Jul 23) to $79.11 (-3% today, after -7.6% yesterday), a ~20% two-session crash. Gold did NOT catch a bid: it is $4,029, -0.5% today, and per today's reporting is down 28% from its January record specifically ON HAWKISH FED EXPECTATIONS. Worse, the mechanism ran backwards \u2014 rate-HIKE odds have RISEN to 35.8% from 25.8% last week even as oil crashed, so the \"Fed pressure lifts when oil falls\" link that the entire hedge rested on is not operating. ADDED RISK: a Fed decision lands this week with rising hike odds \u2014 that is asymmetric downside for a non-yielding gold miner, not a catalyst I want to be long into. TECHNICAL CONFIRMATION: the breakout that justified the entry has failed. I filled at $52.93 \u2014 the exact gap-up open on Jul 27 \u2014 it reversed the same day to close $51.05, and has now closed lower three sessions running ($51.05 -> $50.01), back inside the Jun-Jul range it was supposed to have cleared. Stop $46.50 is not hit, but I exit on a broken thesis rather than waiting for a stop to confirm what I already know. Taking ~-5.6% (~-$45) to redeploy into verified earnings catalysts on the right side of this regime.", "session_id": "20260728-141457-df9e5d"}, {"id": 6, "ts": "2026-07-27 11:32:37", "ticker": "IMO.TO", "side": "sell", "shares": 5, "price": 176.49, "commission": 1.0, "notional": 882.45, "realized_pnl": -2.95, "reason": "Thesis-break: same de-escalation headline (US-Iran strike pause, oil crashing 8%). Refining-crack cushion doesn't offset a crude collapse of this size; exiting same day per plan, ahead of Jul 31 earnings which is now a bigger risk than opportunity.", "session_id": "20260727-113143-f770a1"}, {"id": 5, "ts": "2026-07-27 11:32:35", "ticker": "SU.TO", "side": "sell", "shares": 7, "price": 89.92, "commission": 1.0, "notional": 629.44, "realized_pnl": -5.06, "reason": "Thesis-break: US paused Iran strikes 2nd straight night, talks turning positive, Brent -8.2% / WTI -7.6% today on de-escalation. Master thesis-break rule: sell pure upstream oil beta FIRST on credible de-escalation, regardless of price.", "session_id": "20260727-113143-f770a1"}, {"id": 4, "ts": "2026-07-27 11:28:24", "ticker": "SU.TO", "side": "buy", "shares": 7, "price": 90.5, "commission": 1.0, "notional": 633.5, "realized_pnl": null, "reason": "[queued 2026-07-24 22:56:43] Second integrated with major downstream/retail \u2014 same crack-spread capture as IMO at $100 Brent. Kept SMALLEST of the energy legs (14%) for two honest reasons: it is the most extended name in the group (+19.7% in a month, vs IMO +13%), and it is genuinely correlated XT SESSION: FOMC Jul 29 \u2014 46.5% hike odds, and ~40% expect TWO hikes by Dec. THE PLAN: if Fed HOLDS and CLS holds >$460, ADD CLS to ~18%. If Fed HIKES, high-multiple tech sells off \u2014 do NOT panic; use cash to buy the dip in quality (CLS <$430, CSU) and favour AC/banks over duration. Watch TOU's Jul 29 print for a re-entry setup if guidance is strong AND gas turns.\n\nLESSON: I built Session-2's book as one macro bet (3 of 4 names long the same war). When it flipped I had to liquidate everything at once. Diversify by DRIVER, not just by ticker."}};
const fmt$ = x => x == null ? "-" : x.toLocaleString("en-CA", {style:"currency", currency:"CAD"});

/* ---- theme toggle: auto -> dark -> light ---- */
(function () {
  const btn = document.getElementById("themebtn");
  const order = ["auto", "dark", "light"];
  const label = {auto: "◑ Auto", dark: "☽ Dark", light: "☀ Light"};
  let cur = document.documentElement.dataset.theme || "auto";
  const apply = () => {
    if (cur === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = cur;
    btn.textContent = label[cur];
    try { cur === "auto" ? localStorage.removeItem("theme")
                         : localStorage.setItem("theme", cur); } catch (e) {}
  };
  btn.addEventListener("click", () => {
    cur = order[(order.indexOf(cur) + 1) % order.length]; apply();
  });
  apply();
})();

/* Minimal markdown renderer for AI-written notes/summaries (escapes first). */
function mdInline(s) {
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<i>$2</i>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}
function mdBlock(text) {
  const lines = String(text).split(/\r?\n/);
  let out = "", list = null;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    const h = line.match(/^(#{1,4})\s+(.*)/);
    const ul = line.match(/^\s*[-•]\s+(.*)/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { closeList(); out += `<div class="md-h${h[1].length}">${mdInline(h[2])}</div>`; }
    else if (/^\s*-{3,}\s*$/.test(line)) { closeList(); out += "<hr>"; }
    else if (ul) { if (list !== "ul") { closeList(); out += "<ul>"; list = "ul"; }
                   out += `<li>${mdInline(ul[1])}</li>`; }
    else if (ol) { if (list !== "ol") { closeList(); out += "<ol>"; list = "ol"; }
                   out += `<li>${mdInline(ol[1])}</li>`; }
    else if (line.trim() === "") { closeList(); out += '<div class="md-gap"></div>'; }
    else { closeList(); out += `<p>${mdInline(line)}</p>`; }
  }
  closeList();
  return `<div class="md">${out}</div>`;
}

document.getElementById("subline").textContent =

/* ---- market status pill ---- */

/* ---- stat tiles ---- */
const perf = D.perf;

/* equity change vs the last snapshot of the previous day (~prior close) */
let dayTxt = "", dayCls = "";

const tiles = [

/* ---- chart ---- */
const SERIES = [
  {key: "portfolio", name: "Portfolio", color: "var(--series-1)"},
  {key: "sp500",     name: "S&P 500 (ZSP.TO)", color: "var(--series-2)"},
  {key: "tsx",       name: "TSX Composite", color: "var(--series-3)"},
];
document.getElementById("legend").innerHTML = SERIES.map(s =>
  `<span><span class="swatch" style="background:${s.color}"></span>${s.name}</span>`).join("");

const svg = document.getElementById("chart");
const W = 1000, H = 320, M = {t: 16, r: 158, b: 28, l: 46};
const pts = D.series.map(r => ({...r, t: new Date(r.ts.replace(" ", "T")).getTime()}));

function drawChart() {
  if (pts.length === 0) { svg.outerHTML = '<div class="empty">No snapshots yet — run a session.</div>'; return; }
  const xs = pts.map(p => p.t);
  let vals = [];
  for (const s of SERIES) for (const p of pts) if (p[s.key] != null) vals.push(p[s.key]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let lo = Math.min(...vals, 99.5), hi = Math.max(...vals, 100.5);
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const X = t => x0 === x1 ? (M.l + (W - M.l - M.r) / 2) : M.l + (t - x0) / (x1 - x0) * (W - M.l - M.r);
  const Y = v => M.t + (hi - v) / (hi - lo) * (H - M.t - M.b);
  let g = `<defs><linearGradient id="gradP" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--series-1)" stop-opacity="0.16"/>
    <stop offset="1" stop-color="var(--series-1)" stop-opacity="0"/></linearGradient></defs>`;
  // gridlines + y ticks
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = lo + (hi - lo) * i / steps, y = Y(v);
    g += `<line x1="${M.l}" y1="${y}" x2="${W - M.r}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${M.l - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--ink-muted)">${v.toFixed(1)}</text>`;
  }
  // baseline at 100
  if (lo < 100 && hi > 100)
    g += `<line x1="${M.l}" y1="${Y(100)}" x2="${W - M.r}" y2="${Y(100)}" stroke="var(--baseline)" stroke-width="1" stroke-dasharray="4 3"/>`;
  // x ticks: first, middle, last — show times when the span is under 2 days
  const shortSpan = (x1 - x0) < 48 * 3600 * 1000;
  const tickLabel = p => shortSpan ? p.ts.slice(5, 16) : p.ts.slice(0, 10);
  const tickIdx = [...new Set([0, Math.floor((pts.length - 1) / 2), pts.length - 1])];
  let lastTickX = -1e9;
  for (const i of tickIdx) {
    const tx = X(pts[i].t);
    if (tx - lastTickX < 80) continue;
    lastTickX = tx;
    g += `<text x="${tx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--ink-muted)">${tickLabel(pts[i])}</text>`;
  }
  // gradient area under the portfolio line
  const ppts = pts.filter(p => p.portfolio != null);
  if (ppts.length > 1) {
    const area = ppts.map((p, i) => (i === 0 ? "M" : "L") + X(p.t).toFixed(1) + " " + Y(p.portfolio).toFixed(1)).join(" ")
      + ` L ${X(ppts[ppts.length - 1].t).toFixed(1)} ${H - M.b} L ${X(ppts[0].t).toFixed(1)} ${H - M.b} Z`;
    g += `<path d="${area}" fill="url(#gradP)" stroke="none"/>`;
  }
  // lines
  const endLabels = [];
  for (const s of SERIES) {
    const path = pts.filter(p => p[s.key] != null)
      .map((p, i) => (i === 0 ? "M" : "L") + X(p.t).toFixed(1) + " " + Y(p[s.key]).toFixed(1)).join(" ");
    if (!path) continue;
    g += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lastPt = [...pts].reverse().find(p => p[s.key] != null);
    if (pts.length === 1 || x0 === x1)
      g += `<circle cx="${X(lastPt.t)}" cy="${Y(lastPt[s.key])}" r="4" fill="${s.color}"/>`;
    endLabels.push({y: Y(lastPt[s.key]), color: s.color,
                    text: `${s.name.split(" (")[0]} ${lastPt[s.key].toFixed(1)}`});
  }
  // end labels with collision avoidance: sort by y, enforce 15px spacing
  endLabels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < endLabels.length; i++)
    if (endLabels[i].y - endLabels[i - 1].y < 15) endLabels[i].y = endLabels[i - 1].y + 15;
  for (const l of endLabels) {
    g += `<circle cx="${W - M.r + 10}" cy="${l.y}" r="3.5" fill="${l.color}"/>`;
    g += `<text x="${W - M.r + 18}" y="${l.y + 4}" font-size="12" font-weight="600" fill="var(--ink-1)">${l.text}</text>`;
  }
  // crosshair group (populated on hover)
  g += `<g id="hoverg"></g>`;
  svg.innerHTML = g;

  // hover layer
  const tip = document.getElementById("tooltip");
  svg.addEventListener("mousemove", ev => {
    const rect = svg.getBoundingClientRect();
    const mx = (ev.clientX - rect.left) * (W / rect.width);
    let best = null, bd = 1e18;
    for (const p of pts) { const d = Math.abs(X(p.t) - mx); if (d < bd) { bd = d; best = p; } }
    if (!best) return;
    const hx = X(best.t);
    let hg = `<line x1="${hx}" y1="${M.t}" x2="${hx}" y2="${H - M.b}" stroke="var(--baseline)" stroke-width="1"/>`;
    for (const s of SERIES) if (best[s.key] != null)
      hg += `<circle cx="${hx}" cy="${Y(best[s.key])}" r="4.5" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`;
    document.getElementById("hoverg").innerHTML = hg;
    tip.style.display = "block";
    tip.innerHTML = `<div class="t">${best.ts}</div>` + SERIES.map(s =>
      best[s.key] == null ? "" :
      `<div><span class="swatch" style="background:${s.color};display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px"></span>${s.name}: <b>${best[s.key].toFixed(2)}</b></div>`).join("");
    const wrap = document.getElementById("chartwrap").getBoundingClientRect();
    let tx = ev.clientX - wrap.left + 14;
    if (tx + 180 > wrap.width) tx -= 200;
    tip.style.left = tx + "px";
    tip.style.top = (ev.clientY - wrap.top - 10) + "px";
  });
  svg.addEventListener("mouseleave", () => {
    tip.style.display = "none";
    document.getElementById("hoverg").innerHTML = "";
  });
}
drawChart();

/* ---- tables ---- */
const sidePill = s => `<span class="side ${s.toLowerCase() === "buy" ? "b" : "s"}">${esc(s.toUpperCase())}</span>`;

function table(id, headers, rows, empty) {
  const el = document.getElementById(id);
  if (!rows.length) { el.innerHTML = `<div class="empty">${empty}</div>`; return; }
  el.innerHTML = `<div class="tablewrap"><table><thead><tr>${headers.map(h =>
    `<th class="${h.num ? "num" : ""}">${h.t}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr>${r.map((c, i) =>
      `<td class="${headers[i].num ? "num" : ""} ${headers[i].cls || ""} ${c && c.cls ? c.cls : ""}">${c && c.v !== undefined ? c.v : c}</td>`).join("")}</tr>`).join("") +
    "</tbody></table></div>";
}

/* clamp long trade theses to 3 lines with a more/less toggle */
document.querySelectorAll("td.reason .md").forEach(el => {
  el.classList.add("clamp");
  if (el.scrollHeight > el.clientHeight + 4) {
    const b = document.createElement("button");
    b.className = "morebtn"; b.textContent = "more ▾";
    b.addEventListener("click", () => {
      const open = !el.classList.toggle("clamp");
      b.textContent = open ? "less ▴" : "more ▾";
    });
    el.after(b);
  } else {
    el.classList.remove("clamp");
  }
});
