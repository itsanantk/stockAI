# stockAI — self-running trading sessions + auto-updating dashboard.
#
# Sized for ~30% of a Claude Max 5x weekly budget:
#   - one PRE-MARKET full research session (Opus) before the 9:30 ET open,
#     which queues orders that fill at the opening auction
#   - hourly Sonnet CHECK-INS while the market is open (act only on
#     stops/targets/thesis-breaking news)
# Cron is UTC (13:00 UTC = 9:00 ET in summer / 8:00 ET in winter — both are
# valid pre-market times). --skip-if-closed drops holiday/closed firings;
# --mode auto picks premarket/checkin by the TSX clock.
#
# Required repo secret (Settings -> Secrets -> Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  — from `claude setup-token` (uses your Claude
#                              subscription; no API credits needed)
# Optional: ANTHROPIC_API_KEY — if set (with credits), the API backend is used.

name: stockAI trading session

on:
  schedule:
    - cron: "0 13 * * 1-5"      # pre-market full session (Opus)
    - cron: "0 14-19 * * 1-5"   # hourly check-ins, 10:00-15:00 ET (EDT)
    - cron: "30 19 * * 1-5"     # near-close check-in, 15:30 ET (EDT)
  workflow_dispatch: {}         # manual "Run workflow" button

concurrency:
  group: trading
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run trading session
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python agent.py run --skip-if-closed --mode auto

      - name: Daily summary
        env:
          PYTHONUNBUFFERED: "1"
        run: python agent.py daily

      - name: Commit portfolio state
        run: |
          git config user.name "stockai-bot"
          git config user.email "stockai-bot@users.noreply.github.com"
          git add data/stockai.db data/dashboard.html
          git commit -m "session $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push

      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          cp data/dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: trade
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
